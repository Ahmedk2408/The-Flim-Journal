<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- The Film Journal — monogram favicon.
       Black field, white serif TFJ, thin gold rule beneath.
       Letters are drawn as vector paths so they stay crisp at 16px. -->
  <rect width="100" height="100" fill="#000000"/>

  <!-- T F J — evenly spaced, generous side margins so it reads at tiny sizes -->
  <g fill="#FFFFFF" font-family="Georgia, 'Times New Roman', serif" font-weight="700"
     text-anchor="middle" dominant-baseline="central">

    <!-- T -->
    <text x="24" y="50" font-size="40" letter-spacing="0">T</text>
    <!-- F -->
    <text x="50" y="50" font-size="40" letter-spacing="0">F</text>
    <!-- J -->
    <text x="76" y="50" font-size="40" letter-spacing="0">J</text>
  </g>

  <!-- Thin gold accent rule -->
  <rect x="30" y="68" width="40" height="2.5" fill="#C9A84C"/>
</svg>
