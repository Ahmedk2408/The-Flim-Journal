<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Film Journal</title>
    <meta name="description" content="Authoritative. Independent. Cinematic. The Film Journal brings you premium film reviews, interviews, box office insights, and entertainment news." />

    <!-- Favicon: TFJ monogram (white serif letters + gold rule on black) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />

    <meta name="theme-color" content="#1a1a1a" />

    <!-- Open Graph (WhatsApp, Facebook, iMessage, Telegram) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The Film Journal" />
    <meta property="og:title" content="The Film Journal" />
    <meta property="og:description" content="Authoritative. Independent. Cinematic. Premium film reviews, interviews, and entertainment news." />

    <meta property="og:image:width" content="1200" />

    <meta name="twitter:card" content="summary_large_image" />
